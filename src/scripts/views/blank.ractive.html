<span id="container{{id}}" class="blank {{#blank.hasPendingFeedback}}has-pending-feedback{{/if}} {{#blank.hasHint}}has-tip{{/if}} {{#blank.isCorrect}}correct{{/if}} {{#blank.isError}}error{{/if}} {{#blank.isRetry}}retry{{/if}} {{#blank.isShowingSolution}}showing-solution{{/if}}">
  {{#unless isSelectCloze}}
    <span class="h5p-input-wrapper">
      <input id="{{blank.id}}" type="text" value="{{blank.enteredText}}" 
             size="{{blank.minTextLength}}" on-escape="@this.fire('closeMessage', {}, blank)" 
             on-enter="@this.fire('checkBlank', {}, blank, 'enter')" 
             on-blur="@this.fire('checkBlank', {}, blank, 'blur')" 
             on-focus="@this.fire('focus', {}, blank)"
             on-anykey="@this.fire('textTyped', {}, blank)"
             on-change="@this.fire('textChanged', {}, blank)"
             {{#(blank.isCorrect || blank.isShowingSolution)}}disabled="disabled"{{/if}}
             class="h5p-text-input"
             autocomplete="off"
             autocapitalize="off"/>
      {{#blank.hasHint}}
        <span class="h5p-tip-container">
          <button on-click="@this.fire('showHint', {}, blank)" {{#(blank.isCorrect || blank.isShowingSolution)}}disabled="disabled" {{/if}}>
            <span class="joubel-tip-container" title="Tip" aria-label="Tip" aria-expanded="true" role="button" tabindex="0"><span class="joubel-icon-tip-normal "><span class="h5p-icon-shadow"></span><span class="h5p-icon-speech-bubble"></span><span class="h5p-icon-info"></span></span></span>
          </button>
        </span>
        {{/if}}
    </span>    
  {{/unless}}
  {{#if isSelectCloze}}
      <button class="h5p-notification" on-click="@this.fire('displayFeedback', {}, blank)">
        &#xf05a;
      </button>
      <span class="h5p-input-wrapper h5p-ab-custom-select{{#blank.selectOpen}} is-open{{/if}}{{#blank.selectOpenUp}} open-up{{/if}}">
      <button type="button"
              id="{{blank.id}}"
              class="h5p-text-input h5p-ab-select-trigger"
              aria-haspopup="listbox"
              aria-expanded="{{#blank.selectOpen}}true{{else}}false{{/if}}"
              aria-controls="listbox-{{blank.id}}"
              on-click="@this.fire('toggleSelect', event, blank)"
              on-keydown="@this.fire('selectKeydown', event, blank)"
              on-focus="@this.fire('focus', {}, blank)"
              {{#(blank.selectInteractionLocked || blank.isCorrect || blank.isError || blank.isRetry || blank.isShowingSolution)}}disabled="disabled"{{/if}}
              style="min-width: {{blank.minTextLength}}ch;">
        <span class="h5p-ab-select-label">{{blank.enteredText}}</span>
        <span class="h5p-ab-select-arrow" aria-hidden="true"></span>
      </button>
      {{#if blank.selectOpen}}
      <ul id="listbox-{{blank.id}}"
          class="h5p-ab-select-list"
          role="listbox"
          style="{{blank.selectListStyle}}"
          on-mousedown="@this.fire('selectListPointer', event, blank)">
        {{#each blank.choices:i}}
          <li role="option"
              class="h5p-ab-select-option{{#if this === blank.enteredText}} is-selected{{/if}}{{#if i === blank.selectHighlightIndex}} is-highlighted{{/if}}"
              aria-selected="{{#if this === blank.enteredText}}true{{else}}false{{/if}}"
              on-click="@this.fire('selectChoice', event, blank, this)">{{this}}</li>
        {{/each}}
      </ul>
      {{/if}}
      {{#blank.hasHint}}
        <span class="h5p-tip-container">
          <button on-click="@this.fire('showHint', {}, blank)" {{#(blank.isCorrect || blank.isShowingSolution)}}disabled="disabled"{{/if}}>
            <span class="joubel-tip-container" title="Tip" aria-label="Tip" aria-expanded="true" role="button" tabindex="0"><span class="joubel-icon-tip-normal "><span class="h5p-icon-shadow"></span><span class="h5p-icon-speech-bubble"></span><span class="h5p-icon-info"></span></span></span>
          </button>
        </span>
      {{/if}}
    </span>
  {{/if}}
</span>
